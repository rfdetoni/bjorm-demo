spring:
  application:
    name: bjorm-demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bjorm_demo}
    username: ${DB_USER:bjorm}
    password: ${DB_PASSWORD:bjorm}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
      maximum-pool-size: ${DB_POOL_MAX_SIZE:12}
      minimum-idle: 2
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}
  error:
    include-message: never

bjorm:
  dialect: ${BJORM_DIALECT:postgresql}
  pagination:
    max-offset: ${BJORM_MAX_OFFSET:10000}
