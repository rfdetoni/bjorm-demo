services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bjorm_demo
      POSTGRES_USER: bjorm
      POSTGRES_PASSWORD: bjorm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bjorm -d bjorm_demo"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bjorm_demo
      DB_USER: bjorm
      DB_PASSWORD: bjorm
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-12}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
